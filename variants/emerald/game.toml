# game.toml — Pokémon Emerald Version (GBA), USA
#
# Paths resolve relative to THIS file's directory (variants/emerald/),
# per runtime.cpp resolve_config_path.

[game]
name           = "Pokémon Emerald Version"
short_name     = "emerald"
default_region = "usa"

[bios]
path = "../../gbarecomp/bios/gba_bios.bin"   # override via --bios
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
# HLE BIOS backend (opt-in). hle = true services SWIs via High-Level Emulation
# and skips the BIOS boot intro; any SWI HLE doesn't implement falls back to the
# recompiled (LLE) BIOS, which stays the default + correctness oracle. Set
# hle_keep_intro = true to keep the real BIOS intro while still HLE'ing SWIs.
# CLI (--bios-hle / --no-bios-hle / --bios-hle-keep-intro) and env
# (GBARECOMP_BIOS_HLE / GBARECOMP_BIOS_HLE_KEEP_INTRO) override these.
# Default is LLE (the recompiled real BIOS) — uncomment to opt in:
# hle            = true
# hle_keep_intro = false

[rom]
path = "roms/emerald_usa.gba"   # user-provided; gitignored
# sha1 filled in per region in config/<region>.toml (f3ae0881…).

[recompiler]
entry_point   = "0x08000000"
seeds         = "symbols/imported_symbols.tsv"
boundaries    = "symbols/function_boundaries.tsv"
out_dir       = "generated"
strict        = true

[save]
type = "flash1m"          # Emerald: 1 Mbit (128 KB) flash + RTC

[runtime]
debug_port    = 19892
window_title  = "EmeraldRecomp"

[functions]
arm   = []
thumb = []
